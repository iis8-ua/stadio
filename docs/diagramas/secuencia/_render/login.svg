ray: 2.0,2.0;" x1="308" x2="550" y1="689.7222" y2="689.7222"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="320" y="684.9673">16</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="112" x="338" y="684.9673">401 No autenticado</text><polygon fill="#A80036" points="71,714.6709,61,718.6709,71,722.6709,67,718.6709" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="65" x2="302" y1="718.6709" y2="718.6709"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="77" y="713.916">17</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="97" x="95" y="713.916">mensaje de error</text><!--MD5=[7eb6f2ba1e4b2b2eb98f07181035d1af]
@startuml
skinparam defaultFontName "Arial"
autonumber

actor "Usuario" as User
participant "Front" as SPA
participant "API" as API
database "MySQL" as DB

User -> SPA : email y contraseña
SPA -> API : GET /sanctum/csrf-cookie
API - -> SPA : 204 (cookie XSRF-TOKEN)
SPA -> API : POST /auth/login\n{ email, password } + X-XSRF-TOKEN
activate API
API -> DB : verificar credenciales
activate DB
DB - -> API : usuario + rol + perfil
deactivate DB

alt Credenciales válidas
  alt Administrador (2FA)
    API - -> SPA : 202 requiere segundo factor (TOTP)
    SPA - -> User : solicita código
    User -> SPA : código TOTP / recuperación
    SPA -> API : código + X-XSRF-TOKEN
    API -> API : verificar TOTP
  end
  API -> API : abrir sesión (Sanctum)
  API - -> SPA : 200 { role, trainer_profile, user }\n+ cookie de sesión
  SPA -> SPA : redirigir según rol/perfil
  SPA - -> User : acceso al espacio correspondiente
else Credenciales inválidas
  API - -> SPA : 401 No autenticado
  SPA - -> User : mensaje de error
end
deactivate API

@enduml

