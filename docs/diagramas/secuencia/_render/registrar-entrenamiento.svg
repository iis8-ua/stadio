family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="50" x="680" y="548.5234">resumen</text><polygon fill="#A80036" points="370,578.2271,360,582.2271,370,586.2271,366,582.2271" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="364" x2="639" y1="582.2271" y2="582.2271"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="376" y="577.4722">16</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="234" x="394" y="577.4722">200 resumen (volumen, series, duración)</text><polygon fill="#A80036" points="59,607.1758,49,611.1758,59,615.1758,55,611.1758" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="53" x2="358" y1="611.1758" y2="611.1758"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="14" x="65" y="606.4209">17</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="77" x="83" y="606.4209">resumen final</text><!--MD5=[00d98a88eb64cda67680f9ca9d5c8ba5]
@startuml
skinparam defaultFontName "Arial"
autonumber

actor "Cliente" as C
participant "Front" as SPA
participant "API" as API
database "MySQL" as DB

C -> SPA : empezar entrenamiento
SPA -> API : POST /entrenamientos { rutina_id }
activate API
API -> DB : crear entrenamiento (en curso)
DB - -> API : entrenamiento_id
API - -> SPA : 201 entrenamiento { id }
deactivate API

loop Por cada serie
  C -> SPA : registrar serie (peso, reps, descanso, RIR/RPE)
  SPA -> API : POST /entrenamientos/{id}/series
  activate API
  API -> DB : INSERT serie (pertenece al entrenamiento del cliente)
  DB - -> API : OK
  API - -> SPA : 201 serie
  deactivate API
  SPA - -> C : serie registrada
end

C -> SPA : finalizar entrenamiento
SPA -> API : PATCH /entrenamientos/{id} (finalizado)
activate API
API -> DB : calcular volumen y marcar finalizado
DB - -> API : resumen
API - -> SPA : 200 resumen (volumen, series, duración)
deactivate API
SPA - -> C : resumen final

@enduml

