services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: stadio-app
    volumes:
      - .:/var/www
    networks:
      - stadio-network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: stadio-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - stadio-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: stadio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stadio
      MYSQL_USER: stadio
      MYSQL_PASSWORD: stadio
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - stadio-network

networks:
  stadio-network:
    driver: bridge

volumes:
  db_data: